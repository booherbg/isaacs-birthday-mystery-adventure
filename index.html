<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c1238">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Isaac's Birthday Mystery Adventure</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%233d7be0'/%3E%3Ctext x='8' y='12.5' font-size='11' text-anchor='middle' fill='%23ffde5c' font-family='monospace' font-weight='bold'%3E8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="screen" width="256" height="144"></canvas>
    <div id="hud"><div id="hud-l"></div><div id="hud-c"></div><div id="hud-r"></div></div>
    <div id="banner"></div>
    <div id="tip" hidden></div>
    <div id="toast"></div>

  </div>
  <div class="topbtns" id="topbtns">
      <button id="btn-clues" aria-label="Clue book" title="Clue book">📜</button>
      <button id="btn-pause" aria-label="Menu" title="Menu">☰</button>
      <button id="btn-mute" aria-label="Sound on or off" title="Sound">♪</button>
      <button id="btn-full" aria-label="Full screen" title="Full screen">⛶</button>
    </div>
  <div id="keyhint"></div>
  <div id="ver" hidden></div>
  <div id="dialog" hidden>
    <canvas id="portrait" width="26" height="26"></canvas>
    <div class="dlg-body">
      <div id="dlg-name"></div>
      <div id="dlg-text"></div>
      <div id="dlg-choices"></div>
    </div>
    <div id="dlg-next" hidden>▼</div>
  </div>
  <div id="overlay" hidden></div>
  <div id="pad" hidden>
    <div id="dpad"><div data-dir="left">◀</div><div data-dir="down" hidden>▼</div><div data-dir="right">▶</div></div>
    <div id="actions"><button id="btn-b" hidden></button><button id="btn-a">JUMP</button></div>
  </div>
</div>
<noscript>This game needs JavaScript turned on.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
