<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isaac's Birthday Mystery Adventure</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 30%,#3a2a6e,#1c1238 60%,#120b26);color:#fff;font-family:'Press Start 2P',monospace}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;gap:28px}
  h1{font-size:clamp(20px,6vw,44px);line-height:1.4;color:#ffde5c;text-shadow:4px 4px 0 #e8483f,8px 8px 0 #2a1f33;margin:0;animation:f 2.4s ease-in-out infinite}
  h1 span{color:#fff}
  p{font-size:clamp(10px,2.6vw,14px);line-height:2;opacity:.85;margin:0}
  .q{font-size:clamp(40px,12vw,80px);color:#ffde5c;animation:b 1s ease-in-out infinite alternate}
  @keyframes f{50%{transform:translateY(-6px)}} @keyframes b{to{transform:scale(1.15) rotate(8deg)}}
</style>
</head>
<body><main>
  <div class="q">?</div>
  <h1>ISAAC'S<br><span>BIRTHDAY</span><br>MYSTERY<br>ADVENTURE</h1>
  <p>A mystery is being prepared...<br>Check back soon, detective!</p>
</main></body>
</html>
