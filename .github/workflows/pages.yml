name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version (commit hash + time)
        run: |
          SHA=$(git rev-parse --short HEAD)
          TIME=$(git log -1 --format=%cI)
          printf "// Stamped at deploy.\nexport const VERSION = { sha: '%s', time: '%s' };\n" "$SHA" "$TIME" > js/version.js
          cat js/version.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
